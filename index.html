```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            position: relative;
        }

        /* Background glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        body::before {
            background: #ff4f81;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #7c4dff;
            bottom: -100px;
            right: -100px;
        }

        /* Main Card */
        .card {
            width: min(90%, 500px);
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            position: relative;
            z-index: 10;
            animation: cardIn 1s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .emoji {
            font-size: 70px;
            animation: bounce 1.5s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(5deg);
            }
        }

        h1 {
            margin-top: 15px;
            font-size: clamp(2.2rem, 8vw, 4rem);
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .name {
            color: #fff;
            font-size: clamp(1.7rem, 6vw, 2.6rem);
            margin: 8px 0 20px;
            font-weight: 700;
        }

        .message {
            color: white;
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .wish {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            background: white;
            color: #d63384;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Balloons */
        .balloon {
            position: absolute;
            width: 55px;
            height: 70px;
            border-radius: 50%;
            bottom: -100px;
            z-index: 2;
            animation: float 8s linear infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 90px;
            background: rgba(0,0,0,0.3);
            left: 50%;
            top: 68px;
        }

        .balloon:nth-child(1) {
            left: 8%;
            background: #ff4f81;
            animation-delay: 0s;
        }

        .balloon:nth-child(2) {
            left: 25%;
            background: #ffd166;
            animation-delay: 2s;
        }

        .balloon:nth-child(3) {
            right: 25%;
            background: #06d6a0;
            animation-delay: 4s;
        }

        .balloon:nth-child(4) {
            right: 8%;
            background: #8338ec;
            animation-delay: 1s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(-5deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translateY(-55vh) rotate(8deg);
            }
            100% {
                transform: translateY(-120vh) rotate(-8deg);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 15px;
            top: -20px;
            z-index: 20;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                padding: 35px 20px;
                border-radius: 25px;
            }

            .emoji {
                font-size: 58px;
            }

            .message {
                font-size: 0.95rem;
            }

            .wish {
                font-size: 1rem;
            }

            button {
                padding: 13px 24px;
            }

            .balloon {
                width: 42px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- Balloons -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <!-- Birthday Card -->
    <div class="card">

        <div class="emoji">🎂</div>

        <h1>Happy Birthday!</h1>

        <!-- Change the name here -->
        <div class="name">Dear Ayesha 💕</div>

        <p class="message">
            May your special day be filled with
            endless happiness, beautiful memories,
            laughter and lots of love. ✨
        </p>

        <p class="wish">
            🌸 May all your dreams come true! 🌸
        </p>

        <button onclick="celebrate()">
            🎉 Celebrate Again
        </button>

    </div>

    <script>
        const colors = [
            "#ff4f81",
            "#ffd166",
            "#06d6a0",
            "#8338ec",
            "#ffffff",
            "#ff7b00",
            "#00b4d8"
        ];

        function createConfetti() {

            for (let i = 0; i < 120; i++) {

                const confetti = document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left = Math.random() * 100 + "vw";

                confetti.style.backgroundColor =
                    colors[Math.floor(Math.random() * colors.length)];

                confetti.style.animationDuration =
                    (Math.random() * 3 + 2) + "s";

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                confetti.style.width =
                    (Math.random() * 7 + 6) + "px";

                confetti.style.height =
                    (Math.random() * 10 + 8) + "px";

                confetti.style.transform =
                    `rotate(${Math.random() * 360}deg)`;

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 6000);
            }
        }

        function celebrate() {
            createConfetti();
        }

        // Start celebration automatically
        window.onload = () => {
            createConfetti();
        };
    </script>

</body>
</html>
